<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Performance Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav" aria-label="Page">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <div class="hero-badge" aria-hidden="true">📊</div>
        <h1>Student Performance</h1>
        <p class="tagline">Predict pass or fail from school and lifestyle features using a decision tree</p>
      </header>

      <section class="card" id="model-status" aria-live="polite">
        <p class="status-line">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Training model…</span>
        </p>
        <p class="status-meta" id="status-meta" hidden></p>
      </section>

      <section class="card" id="samples-card" hidden>
        <p class="examples-label">Load a sample profile:</p>
        <div class="example-chips" id="sample-chips"></div>
      </section>

      <form class="card" id="student-form" hidden>
        <div class="form-grid" id="form-grid"></div>
        <button type="submit" class="btn btn-primary" id="btn-predict">Predict</button>
        <p id="error-text" class="error" role="alert" hidden></p>
      </form>

      <section class="card result-card" id="result-card" hidden>
        <p class="result-label">Prediction</p>
        <p id="result-class" class="result-class"></p>
        <div class="prob-bars">
          <div class="prob-row">
            <span>Fail</span>
            <div class="bar-track"><div class="bar bar-fail" id="bar-fail"></div></div>
            <span id="pct-fail"></span>
          </div>
          <div class="prob-row">
            <span>Pass</span>
            <div class="bar-track"><div class="bar bar-pass" id="bar-pass"></div></div>
            <span id="pct-pass"></span>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/session-persist.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
